name: macOS 预览包

on:
  workflow_dispatch:
    inputs:
      library_revision:
        description: 已发布内容库的完整提交 SHA
        type: string
        required: true
        default: 8dc3e269f5fd933421558cb3c96a5010651418ed

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: qihangzhang-272/agent-skill-library
          path: .local/release-content
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: python -m pip install '.[test]' pyinstaller==6.22.2
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: desktop
      - run: npm audit --audit-level=high
        working-directory: desktop
      - run: node node_modules/electron/install.js
        working-directory: desktop
      - name: 构建原生 App 与随包 CLI
        run: python scripts/build_desktop.py --output "$RUNNER_TEMP/asl-build"
      - run: python -m pytest
      - run: npm test
        working-directory: desktop
      - name: 核对 App 调用随包核心及真实渲染
        timeout-minutes: 4
        run: node --test e2e/packaged-renderer.cjs
        working-directory: desktop
        env:
          ASL_TEST_EXE: ${{ runner.temp }}/asl-build/ASL Workspace.app/Contents/MacOS/ASL Workspace
          ASL_E2E_OUTPUT: ${{ runner.temp }}
      - name: 验收打包后的桌面交互
        timeout-minutes: 15
        run: npm run test:e2e
        working-directory: desktop
        env:
          ASL_TEST_EXE: ${{ runner.temp }}/asl-build/ASL Workspace.app/Contents/MacOS/ASL Workspace
          ASL_E2E_OUTPUT: ${{ runner.temp }}
      - name: 保存原生 App 包及校验值
        id: package
        shell: bash
        env:
          ASL_LIBRARY_REVISION: ${{ inputs.library_revision }}
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          architecture=$(uname -m)
          archive="ASL-Workspace-${version}-macOS-${architecture}.zip"
          mkdir "$RUNNER_TEMP/asl-package"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/asl-build/ASL Workspace.app" "$RUNNER_TEMP/asl-package/$archive"
          library_archive="Agent-Skill-Library-${version}-macOS-${architecture}.zip"
          python scripts/package_library.py --app "$RUNNER_TEMP/asl-build/ASL Workspace.app" --repository .local/release-content --revision "$ASL_LIBRARY_REVISION" --output "$RUNNER_TEMP/asl-package/$library_archive"
          ditto -x -k "$RUNNER_TEMP/asl-package/$library_archive" "$RUNNER_TEMP/library-unpack"
          codesign --verify --deep --strict "$RUNNER_TEMP/library-unpack/ASL Workspace.app"
          "$RUNNER_TEMP/library-unpack/ASL Workspace.app/Contents/Resources/core/asl-harness" workspace.validate --workspace "$RUNNER_TEMP/library-unpack/Agent Skill Library"
          cd "$RUNNER_TEMP/asl-package"
          shasum -a 256 "$archive" > "$archive.sha256"
          echo "name=ASL-Workspace-${version}-macOS-${architecture}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ runner.temp }}/asl-package/
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: macOS-desktop-acceptance
          path: ${{ runner.temp }}/asl-e2e-*/
          retention-days: 7
