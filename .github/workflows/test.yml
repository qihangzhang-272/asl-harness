name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: desktop
      - run: npm audit --audit-level=high
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: node node_modules/electron/install.js
        working-directory: desktop
      # Write-gate tests need the real offline renderer on both operating systems.
      - run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}python -m pytest
      - run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}npm test
        working-directory: desktop
      - run: node --test e2e/workspace.cjs
        if: runner.os == 'Windows'
        working-directory: desktop
        env:
          ASL_PYTHON: python
          ASL_E2E_OUTPUT: ${{ runner.temp }}
      - uses: actions/upload-artifact@v6
        if: always() && runner.os == 'Windows'
        with:
          name: desktop-acceptance
          path: ${{ runner.temp }}/asl-e2e-*/
          retention-days: 7
