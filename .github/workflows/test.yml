name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: desktop
      - run: npm audit --audit-level=high
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: node node_modules/electron/install.js
        working-directory: desktop
      - name: Prepare Linux renderer sandbox
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root desktop/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 desktop/node_modules/electron/dist/chrome-sandbox
          xvfb-run -a desktop/node_modules/electron/dist/electron --version
      # Write-gate tests need the real offline renderer on both operating systems.
      - run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}python -m pytest
      - run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}npm test
        working-directory: desktop
      - run: node --test --test-concurrency=1 e2e/workspace.cjs e2e/structure.cjs
        if: runner.os == 'Windows'
        working-directory: desktop
        env:
          ASL_PYTHON: python
          ASL_E2E_OUTPUT: ${{ runner.temp }}
      - uses: actions/upload-artifact@v6
        if: always() && runner.os == 'Windows'
        with:
          name: desktop-acceptance
          path: ${{ runner.temp }}/asl-e2e-*/
          retention-days: 7
